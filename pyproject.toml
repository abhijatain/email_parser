[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-parser-local"
version = "0.1.0"
description = "Decode local email messages into structured JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
email-parser = "email_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Keep the cache writable in isolated cloud tasks as well as local checkouts.
cache-dir = "../.cache/uv"
