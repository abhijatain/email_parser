[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-parser-local"
version = "0.3.0"
description = "An email triage dashboard with Jev AI decisions and a simulated inbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk==0.7.5",
]

[project.scripts]
email-parser = "email_parser.cli:main"
email-inbox = "email_parser.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_parser = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.uv]
# Keep the cache writable in isolated cloud tasks as well as local checkouts.
cache-dir = "../.cache/uv"
